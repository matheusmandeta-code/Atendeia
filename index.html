<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AtendeIA</title>

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
  <main class="container">

    <section class="texto">
      <span class="tag">Atendimento Inteligente</span>

      <h1>AtendeIA 🤖</h1>

      <p>
        A recepcionista virtual para responder clientes,
        informar preços, agendar horários e atender sua empresa
        24 horas por dia.
      </p>
    </section>

    <section class="chat">

      <header class="topo">
        <div class="avatar">AI</div>

        <div>
          <h3>AtendeIA</h3>
          <p>Online agora</p>
        </div>
      </header>

      <div id="mensagens" class="mensagens">
        <div class="ia">
          Olá! Sou a AtendeIA. Como posso ajudar?
        </div>
      </div>

      <form id="formulario">
        <input
          id="entrada"
          type="text"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
          required
        >

        <button type="submit">Enviar</button>
      </form>

    </section>

  </main>

  <script src="script.js?v=5"></script>
</body>
</html>
