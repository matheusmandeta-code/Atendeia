<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtendeIA</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0b0f19;
      color:white;
    }

    .hero{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:60px;
      color:#4ade80;
    }

    p{
      margin-top:20px;
      font-size:22px;
      color:#cbd5e1;
    }

    button{
      margin-top:40px;
      padding:18px 40px;
      font-size:20px;
      border:none;
      border-radius:12px;
      background:#4ade80;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="hero">
    <h1>AtendeIA 🤖</h1>
    <p>A recepcionista inteligente que atende sua empresa 24 horas por dia.</p>

    <button>Quero conhecer</button>
</div>

</body>
</html>
